name: Test Resend email

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient email"
        required: true
        default: "christianvidalwolf@gmail.com"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email through Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ inputs.to }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS https://api.resend.com/emails \
            -X POST \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg to "${TO_EMAIL}" '{from:"Resend Test <onboarding@resend.dev>",to:[$to],subject:"Prueba Resend - Amazon API Seller",text:"Este es un email de prueba enviado desde GitHub Actions mediante Resend. Si lo recibes, la integración funciona correctamente."}')")
          echo "$response" | jq '{id}'
