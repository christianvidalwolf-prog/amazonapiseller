name: Import product costs to Supabase

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: https://ohfupdjjjqoosneojuke.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Upload cost snapshots
        run: |
          python3 - <<'PY'
          import csv, json, os, requests
          from datetime import datetime, timezone
          url=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/snapshots?on_conflict=key'
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          rows=[]
          with open('backend/data/costes_import.csv', encoding='utf-8', newline='') as f:
              for r in csv.DictReader(f): rows.append(r)
          stamp=datetime.now(timezone.utc).isoformat()
          headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}
          for start in range(0,len(rows),500):
              chunk=rows[start:start+500]
              payload={'key':f'costs:products:{start//500:04d}','data':{'source':'Sellerboard','importedAt':stamp,'rows':chunk},'updated_at':stamp}
              res=requests.post(url,headers=headers,json=payload,timeout=60)
              res.raise_for_status()
          meta={'source':'Sellerboard','importedAt':stamp,'rowCount':len(rows),'chunkSize':500,'chunkCount':(len(rows)+499)//500}
          res=requests.post(url,headers=headers,json={'key':'costs:products:meta','data':meta,'updated_at':stamp},timeout=60)
          res.raise_for_status()
          print(json.dumps(meta))
          PY
